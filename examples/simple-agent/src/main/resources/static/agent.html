<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="dark" name="color-scheme">
    <title>Agent 调试台</title>
    <style>
        :root {
            --ink: oklch(0.93 0.012 73);
            --ink-muted: oklch(0.68 0.018 73);
            --ink-faint: oklch(0.5 0.015 73);
            --surface-deep: oklch(0.15 0.012 63);
            --surface: oklch(0.19 0.014 63);
            --surface-raised: oklch(0.235 0.016 63);
            --line: oklch(0.34 0.018 63);
            --accent: oklch(0.73 0.16 52);
            --accent-strong: oklch(0.8 0.17 62);
            --success: oklch(0.73 0.11 145);
            --danger: oklch(0.7 0.17 27);
            --space-2xs: 4px;
            --space-xs: 8px;
            --space-sm: 12px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --font-display: "DIN Alternate", "Bahnschrift", "PingFang SC", sans-serif;
            --font-body: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
            --font-code: "SFMono-Regular", "Cascadia Code", "Microsoft YaHei", monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            color: var(--ink);
            background: linear-gradient(oklch(0.24 0.014 63 / 0.22) 1px, transparent 1px),
            linear-gradient(90deg, oklch(0.24 0.014 63 / 0.22) 1px, transparent 1px),
            var(--surface-deep);
            background-size: 32px 32px;
            font-family: var(--font-body);
            font-size: 15px;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            color: inherit;
        }

        button:focus-visible,
        textarea:focus-visible,
        summary:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .app-shell {
            width: min(1440px, 100%);
            height: 100vh;
            min-height: 100vh;
            margin: 0 auto;
            padding: clamp(16px, 3vw, 40px);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: var(--space-lg);
        }

        .topbar {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: var(--space-lg);
            padding-bottom: var(--space-md);
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            color: var(--surface-deep);
            background: var(--accent);
            border-radius: var(--radius-sm);
            transform: rotate(-2deg);
        }

        .brand-mark svg {
            width: 24px;
            height: 24px;
        }

        .eyebrow {
            margin: 0 0 var(--space-2xs);
            color: var(--accent-strong);
            font-family: var(--font-code);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: var(--font-display);
            font-size: 1.85rem;
            line-height: 1;
            letter-spacing: 0.02em;
        }

        .connection {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            min-width: 0;
            color: var(--ink-muted);
            font-family: var(--font-code);
            font-size: 0.75rem;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: var(--ink-faint);
        }

        .connection[data-state="running"] .connection-dot {
            background: var(--accent);
            animation: pulse 1.1s ease-in-out infinite;
        }

        .connection[data-state="success"] .connection-dot {
            background: var(--success);
        }

        .connection[data-state="error"] .connection-dot {
            background: var(--danger);
        }

        .workspace {
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(230px, 0.27fr) minmax(0, 1fr);
            border: 1px solid var(--line);
            background: var(--surface);
            box-shadow: 12px 12px 0 oklch(0.1 0.01 63 / 0.7);
        }

        .debug-panel {
            min-width: 0;
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-xl);
            border-right: 1px solid var(--line);
            background: oklch(0.175 0.012 63);
        }

        .panel-heading {
            margin: 0 0 var(--space-md);
            color: var(--ink-muted);
            font-family: var(--font-display);
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .endpoint {
            display: block;
            color: var(--ink);
            font-family: var(--font-code);
            font-size: 0.76rem;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .method {
            margin-right: var(--space-xs);
            color: var(--surface-deep);
            background: var(--accent);
            border-radius: 3px;
            padding: 2px 5px;
            font-weight: 800;
        }

        .data-list {
            margin: 0;
            display: grid;
            gap: var(--space-md);
        }

        .data-row {
            min-width: 0;
            display: grid;
            gap: var(--space-2xs);
        }

        .data-row dt {
            color: var(--ink-faint);
            font-size: 0.72rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
        }

        .data-row dd {
            margin: 0;
            min-width: 0;
            color: var(--ink-muted);
            font-family: var(--font-code);
            font-size: 0.75rem;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .session-actions {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
        }

        .text-button {
            padding: 0;
            border: 0;
            border-bottom: 1px solid transparent;
            color: var(--ink-muted);
            background: transparent;
            font-size: 0.76rem;
            cursor: pointer;
        }

        .text-button:hover {
            color: var(--accent-strong);
            border-bottom-color: currentColor;
        }

        .raw-details {
            margin-top: auto;
            min-width: 0;
            border-top: 1px solid var(--line);
            padding-top: var(--space-md);
        }

        .raw-details summary {
            color: var(--ink-muted);
            font-size: 0.78rem;
            cursor: pointer;
            user-select: none;
        }

        .raw-response {
            max-height: 230px;
            margin: var(--space-sm) 0 0;
            padding: var(--space-sm);
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            color: var(--ink-muted);
            background: var(--surface-deep);
            font-family: var(--font-code);
            font-size: 0.7rem;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .chat-panel {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
        }

        .messages {
            min-height: 0;
            padding: clamp(24px, 4vw, 56px);
            display: flex;
            flex-direction: column;
            gap: var(--space-xl);
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .empty-state {
            width: min(620px, 100%);
            margin: auto;
            display: grid;
            gap: var(--space-lg);
            align-content: center;
        }

        .empty-index {
            color: var(--accent);
            font-family: var(--font-code);
            font-size: 0.78rem;
            letter-spacing: 0.1em;
        }

        .empty-state h2 {
            max-width: 18ch;
            margin: 0;
            font-family: var(--font-display);
            font-size: clamp(2rem, 4vw, 3.6rem);
            line-height: 0.98;
            letter-spacing: -0.025em;
        }

        .empty-state p {
            max-width: 52ch;
            margin: 0;
            color: var(--ink-muted);
            line-height: 1.7;
        }

        .prompt-examples {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
        }

        .prompt-chip {
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 8px 12px;
            color: var(--ink-muted);
            background: transparent;
            font-size: 0.78rem;
            cursor: pointer;
            transition: border-color 160ms ease, color 160ms ease, transform 160ms ease;
        }

        .prompt-chip:hover {
            border-color: var(--accent);
            color: var(--ink);
            transform: translateY(-1px);
        }

        .message {
            width: min(760px, 88%);
            display: grid;
            gap: var(--space-xs);
            animation: message-in 260ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .message[data-role="user"] {
            align-self: flex-end;
        }

        .message[data-role="assistant"],
        .message[data-role="error"] {
            align-self: flex-start;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            color: var(--ink-faint);
            font-family: var(--font-code);
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .message[data-role="user"] .message-header {
            justify-content: flex-end;
        }

        .message-body {
            margin: 0;
            padding: var(--space-md) var(--space-lg);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            color: var(--ink);
            background: var(--surface-raised);
            line-height: 1.72;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message[data-role="user"] .message-body {
            border-color: oklch(0.55 0.11 52);
            color: oklch(0.96 0.015 63);
            background: oklch(0.31 0.06 52);
        }

        .message[data-role="error"] .message-body {
            border-color: oklch(0.48 0.13 27);
            color: oklch(0.9 0.07 27);
            background: oklch(0.24 0.055 27);
        }

        .message.is-pending .message-body {
            width: 80px;
            color: var(--accent);
        }

        .typing::after {
            content: "···";
            display: inline-block;
            letter-spacing: 0.18em;
            animation: typing 1.1s steps(4, end) infinite;
        }

        .composer {
            padding: var(--space-md) clamp(16px, 3vw, 32px) var(--space-lg);
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: var(--space-sm);
            align-items: end;
            border-top: 1px solid var(--line);
            background: oklch(0.18 0.013 63);
        }

        .input-wrap {
            min-width: 0;
            display: grid;
            gap: var(--space-xs);
        }

        textarea {
            width: 100%;
            min-height: 52px;
            max-height: 180px;
            resize: none;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 14px var(--space-md);
            color: var(--ink);
            background: var(--surface-deep);
            line-height: 1.5;
            caret-color: var(--accent);
        }

        textarea::placeholder {
            color: var(--ink-faint);
        }

        .input-hint {
            display: flex;
            justify-content: space-between;
            gap: var(--space-sm);
            color: var(--ink-faint);
            font-size: 0.68rem;
        }

        .send-button {
            min-width: 100px;
            min-height: 52px;
            border: 1px solid var(--accent);
            border-radius: var(--radius-sm);
            padding: 0 var(--space-lg);
            color: var(--surface-deep);
            background: var(--accent);
            font-family: var(--font-display);
            font-weight: 800;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: background 160ms ease, transform 160ms ease;
        }

        .send-button:hover:not(:disabled) {
            background: var(--accent-strong);
            transform: translateY(-1px);
        }

        .send-button[data-mode="stop"] {
            color: oklch(0.92 0.05 27);
            border-color: oklch(0.58 0.14 27);
            background: oklch(0.3 0.08 27);
        }

        .send-button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        .toast {
            position: fixed;
            right: var(--space-lg);
            bottom: var(--space-lg);
            z-index: 10;
            padding: var(--space-sm) var(--space-md);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            color: var(--ink);
            background: var(--surface-raised);
            box-shadow: 0 10px 30px oklch(0.08 0.01 63 / 0.45);
            font-size: 0.78rem;
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .toast.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes pulse {
            50% {
                opacity: 0.35;
                transform: scale(0.75);
            }
        }

        @keyframes message-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes typing {
            0%, 25% {
                clip-path: inset(0 100% 0 0);
            }
            100% {
                clip-path: inset(0 0 0 0);
            }
        }

        @media (max-width: 840px) {
            .app-shell {
                height: auto;
                padding: var(--space-md);
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .workspace {
                grid-template-columns: 1fr;
            }

            .debug-panel {
                padding: var(--space-md);
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: var(--space-lg);
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .raw-details {
                grid-column: 1 / -1;
                margin-top: 0;
            }

            .chat-panel {
                min-height: 620px;
            }

            .messages {
                max-height: none;
                padding: var(--space-lg);
            }
        }

        @media (max-width: 560px) {
            .debug-panel {
                grid-template-columns: 1fr;
            }

            .raw-details {
                grid-column: auto;
            }

            .message {
                width: 96%;
            }

            .composer {
                grid-template-columns: 1fr;
            }

            .send-button {
                min-height: 46px;
            }

            .input-hint span:last-child {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
<main class="app-shell">
    <header class="topbar">
        <div class="brand">
            <div aria-hidden="true" class="brand-mark">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M4 7h16M7 4v6m10-6v6M5 13h5v6H5zm9 0h5v6h-5z"/>
                </svg>
            </div>
            <div>
                <p class="eyebrow">Local runtime / console 01</p>
                <h1>Agent 调试台</h1>
            </div>
        </div>
        <div aria-live="polite" class="connection" data-state="idle" id="connection" role="status">
            <span aria-hidden="true" class="connection-dot"></span>
            <span id="connectionText">待命 · 127.0.0.1:8080</span>
        </div>
    </header>

    <section aria-label="Agent 对话调试区" class="workspace">
        <aside aria-label="调试信息" class="debug-panel">
            <section>
                <h2 class="panel-heading">请求目标</h2>
                <code class="endpoint"><span class="method">POST</span>http://127.0.0.1:8080/agents/run</code>
            </section>

            <section>
                <h2 class="panel-heading">运行上下文</h2>
                <dl class="data-list">
                    <div class="data-row">
                        <dt>Session ID</dt>
                        <dd id="sessionId">—</dd>
                    </div>
                    <div class="data-row">
                        <dt>Run ID</dt>
                        <dd id="runId">尚未运行</dd>
                    </div>
                    <div class="data-row">
                        <dt>Turns</dt>
                        <dd id="turns">—</dd>
                    </div>
                    <div class="data-row">
                        <dt>Latency</dt>
                        <dd id="latency">—</dd>
                    </div>
                </dl>
            </section>

            <section>
                <h2 class="panel-heading">会话控制</h2>
                <div class="session-actions">
                    <button class="text-button" id="copySession" type="button">复制 ID</button>
                    <button class="text-button" id="newSession" type="button">新建会话</button>
                </div>
            </section>

            <details class="raw-details">
                <summary>查看最近响应</summary>
                <pre class="raw-response" id="rawResponse">尚无响应</pre>
            </details>
        </aside>

        <section aria-label="对话区" class="chat-panel">
            <div aria-live="polite" class="messages" id="messages">
                <div class="empty-state" id="emptyState">
                    <span class="empty-index">01 / READY</span>
                    <h2>发送消息，观察 Agent 如何行动。</h2>
                    <p>同一会话 ID 会自动保留多轮上下文。每次响应的运行标识、轮次和耗时会同步显示在左侧。</p>
                    <div aria-label="示例问题" class="prompt-examples">
                        <button class="prompt-chip" type="button">查询新闻列表</button>
                        <button class="prompt-chip" type="button">介绍第一条新闻</button>
                        <button class="prompt-chip" type="button">总结刚才的内容</button>
                    </div>
                </div>
            </div>

            <form class="composer" id="composer">
                <div class="input-wrap">
                    <label class="sr-only" for="prompt">消息内容</label>
                    <textarea aria-label="消息内容" id="prompt" maxlength="10000" placeholder="输入调试消息…" required
                              rows="1"></textarea>
                    <div class="input-hint">
                        <span id="charCount">0 / 10000</span>
                        <span>Enter 发送 · Shift + Enter 换行</span>
                    </div>
                </div>
                <button class="send-button" id="sendButton" type="submit">发送</button>
            </form>
        </section>
    </section>
</main>

<div aria-live="polite" class="toast" id="toast" role="status"></div>

<script>
    (() => {
        const API_ENDPOINT = "http://127.0.0.1:8080/agents/run";
        const STORAGE_KEY = "agent-debug-console-state-v1";
        const MAX_INPUT_LENGTH = 10000;

        const elements = {
            composer: document.querySelector("#composer"),
            prompt: document.querySelector("#prompt"),
            sendButton: document.querySelector("#sendButton"),
            messages: document.querySelector("#messages"),
            emptyState: document.querySelector("#emptyState"),
            connection: document.querySelector("#connection"),
            connectionText: document.querySelector("#connectionText"),
            sessionId: document.querySelector("#sessionId"),
            runId: document.querySelector("#runId"),
            turns: document.querySelector("#turns"),
            latency: document.querySelector("#latency"),
            rawResponse: document.querySelector("#rawResponse"),
            newSession: document.querySelector("#newSession"),
            copySession: document.querySelector("#copySession"),
            charCount: document.querySelector("#charCount"),
            toast: document.querySelector("#toast")
        };

        let sessionId = "";
        let messages = [];
        let activeController = null;
        let toastTimer = null;

        /** 生成可供后端连续对话使用的会话标识。 */
        function createSessionId() {
            if (globalThis.crypto?.randomUUID) {
                return globalThis.crypto.randomUUID();
            }
            return `web-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        /** 从浏览器存储恢复当前调试会话。 */
        function restoreState() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
                sessionId = saved?.sessionId || createSessionId();
                messages = Array.isArray(saved?.messages) ? saved.messages : [];
            } catch (error) {
                sessionId = createSessionId();
                messages = [];
            }
        }

        /** 保存会话标识和页面消息，便于刷新后继续调试。 */
        function persistState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({sessionId, messages}));
        }

        /** 更新顶部接口运行状态。 */
        function setConnectionState(state, text) {
            elements.connection.dataset.state = state;
            elements.connectionText.textContent = text;
        }

        /** 显示短暂的操作反馈。 */
        function showToast(text) {
            window.clearTimeout(toastTimer);
            elements.toast.textContent = text;
            elements.toast.classList.add("is-visible");
            toastTimer = window.setTimeout(() => elements.toast.classList.remove("is-visible"), 1800);
        }

        /** 将一条消息安全渲染到对话区。 */
        function createMessageElement(message, pending = false) {
            const article = document.createElement("article");
            article.className = `message${pending ? " is-pending" : ""}`;
            article.dataset.role = message.role;

            const header = document.createElement("div");
            header.className = "message-header";
            header.textContent = message.role === "user" ? "YOU" : message.role === "error" ? "ERROR" : "AGENT";

            const body = document.createElement("p");
            body.className = `message-body${pending ? " typing" : ""}`;
            body.textContent = pending ? "" : message.content;

            article.append(header, body);
            return article;
        }

        /** 根据当前消息列表刷新整个对话区域。 */
        function renderMessages() {
            elements.messages.replaceChildren();
            if (messages.length === 0) {
                elements.messages.append(elements.emptyState);
                return;
            }
            messages.forEach((message) => elements.messages.append(createMessageElement(message)));
            scrollToLatest();
        }

        /** 滚动到最新一条消息。 */
        function scrollToLatest() {
            requestAnimationFrame(() => {
                elements.messages.scrollTop = elements.messages.scrollHeight;
            });
        }

        /** 自动调整输入框高度并更新字数。 */
        function updateComposer() {
            elements.prompt.style.height = "auto";
            elements.prompt.style.height = `${Math.min(elements.prompt.scrollHeight, 180)}px`;
            elements.charCount.textContent = `${elements.prompt.value.length} / ${MAX_INPUT_LENGTH}`;
        }

        /** 切换发送与终止请求两种操作状态。 */
        function setRunning(running) {
            elements.prompt.disabled = running;
            elements.sendButton.dataset.mode = running ? "stop" : "send";
            elements.sendButton.textContent = running ? "终止" : "发送";
            elements.sendButton.type = running ? "button" : "submit";
        }

        /** 解析 HTTP 响应，并在错误时保留后端返回内容。 */
        async function parseResponse(response) {
            const responseText = await response.text();
            let payload;
            try {
                payload = responseText ? JSON.parse(responseText) : {};
            } catch (error) {
                payload = {message: responseText || "服务未返回内容"};
            }
            if (!response.ok) {
                const detail = payload.message || payload.error || response.statusText;
                throw new Error(`HTTP ${response.status}: ${detail}`);
            }
            return payload;
        }

        /** 调用 Agent 接口并同步页面调试数据。 */
        async function sendMessage(input) {
            const requestBody = {input, sessionId};
            messages.push({role: "user", content: input});
            persistState();
            renderMessages();

            const pendingElement = createMessageElement({role: "assistant", content: ""}, true);
            elements.messages.append(pendingElement);
            scrollToLatest();

            activeController = new AbortController();
            const startedAt = performance.now();
            setRunning(true);
            setConnectionState("running", "运行中 · 正在等待 Agent");
            elements.rawResponse.textContent = JSON.stringify({request: requestBody}, null, 2);

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(requestBody),
                    signal: activeController.signal
                });
                const payload = await parseResponse(response);
                const elapsed = Math.round(performance.now() - startedAt);

                sessionId = payload.sessionId || sessionId;
                messages.push({role: "assistant", content: payload.finalOutput ?? "服务未返回 finalOutput"});
                elements.sessionId.textContent = sessionId;
                elements.runId.textContent = payload.runId || "—";
                elements.turns.textContent = payload.turns ?? "—";
                elements.latency.textContent = `${elapsed} ms`;
                elements.rawResponse.textContent = JSON.stringify(payload, null, 2);
                setConnectionState("success", `成功 · ${elapsed} ms`);
                persistState();
            } catch (error) {
                const aborted = error.name === "AbortError";
                const message = aborted ? "请求已由用户终止" : error.message;
                messages.push({role: "error", content: message});
                elements.latency.textContent = `${Math.round(performance.now() - startedAt)} ms`;
                elements.rawResponse.textContent = JSON.stringify({request: requestBody, error: message}, null, 2);
                setConnectionState("error", aborted ? "已终止" : "请求失败 · 检查服务与控制台");
                persistState();
            } finally {
                pendingElement.remove();
                activeController = null;
                setRunning(false);
                renderMessages();
                elements.prompt.focus();
            }
        }

        /** 提交输入框中的有效消息。 */
        function submitPrompt() {
            const input = elements.prompt.value.trim();
            if (!input || activeController) {
                return;
            }
            elements.prompt.value = "";
            updateComposer();
            void sendMessage(input);
        }

        /** 创建全新会话并重置页面运行数据。 */
        function startNewSession() {
            if (activeController) {
                showToast("请先终止当前请求");
                return;
            }
            sessionId = createSessionId();
            messages = [];
            elements.sessionId.textContent = sessionId;
            elements.runId.textContent = "尚未运行";
            elements.turns.textContent = "—";
            elements.latency.textContent = "—";
            elements.rawResponse.textContent = "尚无响应";
            setConnectionState("idle", "待命 · 127.0.0.1:8080");
            persistState();
            renderMessages();
            elements.prompt.focus();
            showToast("已创建新会话");
        }

        elements.composer.addEventListener("submit", (event) => {
            event.preventDefault();
            submitPrompt();
        });

        elements.sendButton.addEventListener("click", () => {
            if (activeController) {
                activeController.abort();
            }
        });

        elements.prompt.addEventListener("input", updateComposer);
        elements.prompt.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
                event.preventDefault();
                submitPrompt();
            }
        });

        document.querySelectorAll(".prompt-chip").forEach((button) => {
            button.addEventListener("click", () => {
                elements.prompt.value = button.textContent;
                updateComposer();
                elements.prompt.focus();
            });
        });

        elements.newSession.addEventListener("click", startNewSession);
        elements.copySession.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(sessionId);
                showToast("会话 ID 已复制");
            } catch (error) {
                showToast("复制失败，请手动选择 ID");
            }
        });

        restoreState();
        elements.sessionId.textContent = sessionId;
        renderMessages();
        updateComposer();
        elements.prompt.focus();
    })();
</script>
</body>
</html>
